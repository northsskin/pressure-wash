name: Deploy to GitHub Pages

# The site is a single static index.html — no build step. This workflow just
# uploads the repo as-is to GitHub Pages.
on:
  push:
    # The feature branch is currently the repo's default branch; once the site
    # is merged into main, the extra entry can be removed.
    branches: [main, claude/blast-off-cleaning-site-o464wd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true keeps the repo's Pages mode on "GitHub Actions"
      # (away from legacy branch deployment).
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
